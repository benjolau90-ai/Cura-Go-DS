<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Handoff - Häufigkeits-Control</title>
  <link rel="stylesheet" href="tokens.css?v=4" />
  <link rel="stylesheet" href="style.css?v=17" />
  <link rel="stylesheet" href="modal-playground.css?v=3" />
</head>
<body class="modal-playground-body">
  <main class="modal-playground">
    <section class="modal-playground__stage" aria-label="Häufigkeits-Control Handoff">
      <div class="modal-playground__app" aria-hidden="true">
        <aside class="modal-playground__sidebar">
          <strong>go.vital</strong>
          <span>Übersicht</span>
          <span>Messblatt</span>
          <span>Auswertung</span>
          <span class="is-active">Planung</span>
          <span>Einstellungen</span>
        </aside>
        <section class="modal-playground__list">
          <header>
            <h1>Planung für</h1>
            <span class="modal-playground__search">Dieter Rump</span>
          </header>
        </section>
        <aside class="modal-playground__timeline">
          <h2>Tagesvorschau</h2>
        </aside>
      </div>

      <div class="modal-playground__scrim" aria-hidden="true"></div>

      <div class="modal modal-playground__dialog" role="dialog" aria-modal="true" aria-labelledby="handoffTitle">
        <div class="modal__header">
          <div class="modal__header-title">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
              <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            </svg>
            <span id="handoffTitle">Neue Planung</span>
          </div>
          <button class="btn btn--icon btn--ghost" type="button" aria-label="Dialog schließen">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
            </svg>
          </button>
        </div>

        <div class="modal__body modal-playground__body">
          <div class="modal__card modal-playground__card">
            <label class="modal-playground-field modal-playground-field--full">
              <span class="form-label">Typ</span>
              <span class="form-input modal-playground-input">
                <span class="form-input__value">Blutzucker</span>
                <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" />
                </svg>
              </span>
            </label>

            <div class="form-row">
              <label class="modal-playground-field">
                <span class="form-label">Startdatum</span>
                <span class="form-input modal-playground-input">
                  <input class="modal-playground-native-input" type="text" value="Heute" aria-label="Startdatum" />
                  <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="17" rx="3" stroke="currentColor" stroke-width="2" />
                    <path d="M3 9H21" stroke="currentColor" stroke-width="2" />
                    <path d="M8 2V6M16 2V6" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
                  </svg>
                </span>
              </label>
              <label class="modal-playground-field">
                <span class="form-label">Enddatum</span>
                <span class="form-input modal-playground-input">
                  <input class="modal-playground-native-input" type="text" value="" placeholder="Kein Enddatum (fortlaufend)" aria-label="Enddatum" />
                  <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="17" rx="3" stroke="currentColor" stroke-width="2" />
                    <path d="M3 9H21" stroke="currentColor" stroke-width="2" />
                    <path d="M8 2V6M16 2V6" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
                  </svg>
                </span>
              </label>
            </div>

            <div class="modal-playground-frequency-block modal-playground-row--floating">
              <span class="form-label">Häufigkeit</span>
              <span class="modal-playground-frequency-builder" data-frequency-control>
                <span class="modal-playground-frequency-builder__prefix" data-frequency-prefix>Alle</span>
                <span class="modal-playground-stepper">
                  <button class="modal-playground-stepper__button" type="button" aria-label="Intervall verringern" data-frequency-step="-1">
                    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M6 12H18" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
                    </svg>
                  </button>
                  <input type="number" value="3" min="1" inputmode="numeric" aria-label="Intervall-Anzahl" data-frequency-amount />
                  <button class="modal-playground-stepper__button" type="button" aria-label="Intervall erhöhen" data-frequency-step="1">
                    <svg class="icon icon--sm" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                      <path d="M12 6V18M6 12H18" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
                    </svg>
                  </button>
                </span>
                <select aria-label="Intervall-Einheit" data-frequency-unit>
                  <option value="minutes" data-singular="Minute" data-plural="Minuten" data-every="Jede">Minuten</option>
                  <option value="hours" data-singular="Stunde" data-plural="Stunden" data-every="Jede">Stunden</option>
                  <option value="days" data-singular="Tag" data-plural="Tage" data-every="Jeden" selected>Tage</option>
                  <option value="weeks" data-singular="Woche" data-plural="Wochen" data-every="Jede">Wochen</option>
                  <option value="months" data-singular="Monat" data-plural="Monate" data-every="Jeden">Monate</option>
                </select>
                <span class="modal-playground-frequency-builder__join">um</span>
                <span class="form-input modal-playground-input modal-playground-time-input">
                  <input class="modal-playground-native-input" type="text" value="00:00" aria-label="Startzeit" data-start-time />
                </span>
              </span>

              <div class="modal-playground-weekday-section" data-frequency-weekdays aria-hidden="true">
                <span class="form-label">Tage auswählen</span>
                <span class="modal-playground-weekdays">
                  <button class="chip chip--status" type="button" aria-pressed="false">Mo</button>
                  <button class="chip chip--status is-active" type="button" aria-pressed="true">Di</button>
                  <button class="chip chip--status" type="button" aria-pressed="false">Mi</button>
                  <button class="chip chip--status" type="button" aria-pressed="false">Do</button>
                  <button class="chip chip--status is-active" type="button" aria-pressed="true">Fr</button>
                  <button class="chip chip--status" type="button" aria-pressed="false">Sa</button>
                  <button class="chip chip--status" type="button" aria-pressed="false">So</button>
                </span>
              </div>
            </div>

            <section class="modal-playground-preview" aria-live="polite">
              <strong>Vorschau</strong>
              <span data-frequency-preview>Alle 3 Tage um 00:00 Uhr.</span>
            </section>
          </div>
        </div>

        <div class="modal__footer">
          <button class="btn btn--secondary" type="button">Abbrechen</button>
          <div class="modal__footer-actions">
            <button class="btn btn--primary" type="button">Planung anlegen</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const frequencyControl = document.querySelector("[data-frequency-control]");

    const updateFrequencyCopy = () => {
      if (!frequencyControl) return;
      const input = frequencyControl.querySelector("[data-frequency-amount]");
      const unitSelect = frequencyControl.querySelector("[data-frequency-unit]");
      const prefix = frequencyControl.querySelector("[data-frequency-prefix]");
      const weekdays = document.querySelector("[data-frequency-weekdays]");
      const startTime = document.querySelector("[data-start-time]");
      const preview = document.querySelector("[data-frequency-preview]");
      const amount = Math.max(Number(input.min || 1), Number(input.value || input.min || 1));
      const selectedOption = unitSelect.selectedOptions[0];
      const isSingular = amount === 1;

      unitSelect.querySelectorAll("option").forEach((option) => {
        option.textContent = isSingular ? option.dataset.singular : option.dataset.plural;
      });

      prefix.textContent = isSingular ? selectedOption.dataset.every : "Alle";

      if (weekdays) {
        const showWeekdays = unitSelect.value === "weeks";
        weekdays.classList.toggle("is-visible", showWeekdays);
        weekdays.setAttribute("aria-hidden", String(!showWeekdays));
      }

      if (preview) {
        const time = startTime?.value || "00:00";
        const selectedWeekdays = Array.from(document.querySelectorAll("[data-frequency-weekdays] .chip.is-active"))
          .map((chip) => chip.textContent.trim());
        const cadence = isSingular
          ? `${selectedOption.dataset.every} ${selectedOption.dataset.singular}`.replace("Jeden Tag", "Täglich").replace("Jede Woche", "Wöchentlich").replace("Jeden Monat", "Monatlich")
          : `Alle ${amount} ${selectedOption.dataset.plural}`;
        const weekdayText = unitSelect.value === "weeks" && selectedWeekdays.length
          ? ` (${selectedWeekdays.join(", ")})`
          : "";
        preview.textContent = `${cadence}${weekdayText} um ${time} Uhr.`;
      }
    };

    frequencyControl?.querySelectorAll("[data-frequency-step]").forEach((button) => {
      button.addEventListener("click", () => {
        const input = frequencyControl.querySelector("[data-frequency-amount]");
        const step = Number(button.dataset.frequencyStep);
        const nextValue = Math.max(Number(input.min || 1), Number(input.value || input.min || 1) + step);
        input.value = String(nextValue);
        updateFrequencyCopy();
      });
    });

    frequencyControl?.querySelector("[data-frequency-amount]")?.addEventListener("input", updateFrequencyCopy);
    frequencyControl?.querySelector("[data-frequency-unit]")?.addEventListener("change", updateFrequencyCopy);
    document.querySelector("[data-start-time]")?.addEventListener("input", updateFrequencyCopy);
    frequencyControl?.querySelector("[data-frequency-amount]")?.addEventListener("blur", (event) => {
      const input = event.currentTarget;
      input.value = String(Math.max(Number(input.min || 1), Number(input.value || input.min || 1)));
      updateFrequencyCopy();
    });

    document.querySelectorAll("[data-frequency-weekdays] .chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const nextPressed = chip.getAttribute("aria-pressed") !== "true";
        chip.setAttribute("aria-pressed", String(nextPressed));
        chip.classList.toggle("is-active", nextPressed);
        updateFrequencyCopy();
      });
    });

    updateFrequencyCopy();
  </script>
</body>
</html>
