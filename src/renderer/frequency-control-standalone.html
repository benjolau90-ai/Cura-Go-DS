<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Häufigkeits-Control Standalone</title>
  <style>
    :root {
      color-scheme: light;
      --font-body: "Open Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --font-heading: "Roboto", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #eef3ff;
      --scrim: rgba(16, 20, 28, 0.38);
      --surface: #ffffff;
      --surface-muted: #f4f7fb;
      --surface-soft: rgba(255, 255, 255, 0.72);
      --border: #cfd8e3;
      --border-subtle: #e3e8ef;
      --text: #151922;
      --text-muted: #667085;
      --primary: #2f63df;
      --primary-soft: #e8f1ff;
      --focus: rgba(47, 99, 223, 0.32);
      --radius-sm: 8px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-modal: 0 18px 42px rgba(19, 26, 42, 0.22), 0 2px 8px rgba(19, 26, 42, 0.12);
      --shadow-field: inset 0 1px 0 rgba(255, 255, 255, 0.85);
      --shadow-focus: var(--shadow-field), 0 0 0 3px var(--focus);
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 12% 8%, rgba(255, 196, 214, 0.55), transparent 32%),
        radial-gradient(circle at 88% 0%, rgba(209, 226, 255, 0.9), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    select {
      font: inherit;
    }

    .stage {
      position: relative;
      width: min(100%, 1120px);
      min-height: 720px;
      overflow: hidden;
      border: 1px solid rgba(207, 216, 227, 0.76);
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.64);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .background-app {
      position: absolute;
      inset: 0;
      display: grid;
      grid-template-columns: 224px 1fr 360px;
      background: var(--surface);
    }

    .sidebar,
    .content,
    .timeline {
      padding: 24px;
    }

    .sidebar {
      display: grid;
      align-content: start;
      gap: 10px;
      border-right: 1px solid var(--border-subtle);
      background:
        radial-gradient(circle at 14% 8%, rgba(237, 126, 126, 0.32), transparent 36%),
        rgba(255, 255, 255, 0.52);
    }

    .sidebar strong {
      margin-bottom: 18px;
      font: 700 18px/1.25 var(--font-heading);
    }

    .sidebar span {
      min-height: 36px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-weight: 600;
    }

    .sidebar .active {
      background: var(--primary-soft);
      color: var(--text);
    }

    .content {
      display: grid;
      align-content: start;
      gap: 14px;
      border-right: 1px solid var(--border);
    }

    .content header,
    .timeline header {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .content h1,
    .timeline h2 {
      margin: 0;
      font: 700 22px/1.25 var(--font-heading);
    }

    .ghost-field {
      min-width: 220px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      color: var(--text-muted);
    }

    .row-card {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--surface-muted);
    }

    .timeline {
      display: grid;
      align-content: start;
      gap: 14px;
      background: var(--surface);
    }

    .scrim {
      position: absolute;
      inset: 0;
      background: var(--scrim);
      backdrop-filter: blur(5px);
    }

    .modal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 632px;
      max-width: calc(100% - 48px);
      overflow: visible;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: #eef2f8;
      box-shadow: var(--shadow-modal);
      transform: translate(-50%, -50%);
    }

    .modal-header {
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .modal-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }

    .modal-card {
      display: grid;
      gap: 18px;
      margin: 0 16px;
      padding: 16px;
      overflow: visible;
      border-radius: var(--radius-md);
      background: var(--surface);
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .field {
      display: grid;
      flex: 1;
      gap: 6px;
      min-width: 0;
    }

    .label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
    }

    .input {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-field);
      color: var(--text);
    }

    .input:focus-within,
    select:focus {
      border-color: var(--primary);
      box-shadow: var(--shadow-focus);
      outline: 0;
    }

    .input input {
      flex: 1;
      min-width: 0;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .icon-button,
    .step-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
    }

    .icon-button {
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
    }

    .frequency-block {
      display: grid;
      gap: 10px;
    }

    .frequency-builder {
      display: grid;
      grid-template-columns: 46px auto minmax(104px, 1fr) auto 104px;
      align-items: center;
      gap: 8px;
      min-height: 52px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: var(--surface);
      box-shadow: var(--shadow-field);
      white-space: nowrap;
    }

    .frequency-prefix {
      width: 46px;
      text-align: center;
      color: var(--text-muted);
    }

    .stepper {
      height: 34px;
      display: inline-flex;
      align-items: center;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-field);
    }

    .step-button {
      width: 32px;
      height: 100%;
    }

    .step-button:hover,
    .step-button:focus-visible {
      background: var(--surface-muted);
      color: var(--text);
      outline: 0;
    }

    .stepper input {
      width: 44px;
      height: 100%;
      padding: 0;
      border: 0;
      border-left: 1px solid var(--border-subtle);
      border-right: 1px solid var(--border-subtle);
      outline: 0;
      background: transparent;
      text-align: center;
    }

    .stepper input::-webkit-outer-spin-button,
    .stepper input::-webkit-inner-spin-button {
      margin: 0;
      appearance: none;
    }

    .stepper:focus-within {
      border-color: var(--primary);
      box-shadow: var(--shadow-focus);
    }

    .frequency-builder select {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      box-shadow: var(--shadow-field);
      color: var(--text);
      cursor: pointer;
    }

    .frequency-join {
      color: var(--text-muted);
    }

    .time-input {
      min-height: 34px;
      padding: 0 10px;
    }

    .weekday-section {
      display: grid;
      gap: 8px;
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      transform: translateY(-4px);
      transition: max-height 0.22s ease, opacity 0.16s ease, transform 0.18s ease;
    }

    .weekday-section.is-visible {
      max-height: 78px;
      opacity: 1;
      transform: translateY(0);
    }

    .weekdays {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      min-width: 34px;
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 9px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .chip.is-active {
      border-color: color-mix(in srgb, var(--primary) 42%, var(--border));
      background: var(--primary-soft);
      color: var(--primary);
    }

    .preview {
      display: grid;
      gap: 8px;
      padding: 16px;
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      background: var(--surface);
    }

    .preview strong {
      font-weight: 700;
    }

    .preview span {
      font: 700 15px/1.45 var(--font-body);
    }

    .modal-footer {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
    }

    .btn {
      min-height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.68);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.58), 0 1px 2px rgba(16, 24, 40, 0.08);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary {
      border-color: #234fb8;
      background: #2f63df;
      color: #ffffff;
    }

    @media (max-width: 720px) {
      .modal {
        max-width: calc(100% - 24px);
      }

      .form-row {
        flex-direction: column;
      }

      .frequency-builder {
        grid-template-columns: 46px auto minmax(118px, 1fr);
      }

      .frequency-join {
        grid-column: 1 / 2;
      }

      .time-input {
        grid-column: 2 / -1;
      }
    }
  </style>
</head>
<body>
  <section class="stage" aria-label="Häufigkeits-Control Standalone">
    <div class="background-app" aria-hidden="true">
      <aside class="sidebar">
        <strong>go.vital</strong>
        <span>Übersicht</span>
        <span>Messblatt</span>
        <span>Auswertung</span>
        <span class="active">Planung</span>
        <span>Einstellungen</span>
      </aside>
      <main class="content">
        <header>
          <h1>Planung für</h1>
          <span class="ghost-field">Dieter Rump</span>
        </header>
        <div class="row-card"><span>Herzfrequenz</span><strong>jede Stunde</strong></div>
        <div class="row-card"><span>Blutzucker</span><strong>Alle 6h</strong></div>
      </main>
      <aside class="timeline">
        <header><h2>Tagesvorschau</h2></header>
      </aside>
    </div>

    <div class="scrim" aria-hidden="true"></div>

    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="title">
      <header class="modal-header">
        <div class="modal-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
            <path d="M12 8V16M8 12H16" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
          </svg>
          <span id="title">Neue Planung</span>
        </div>
        <button class="icon-button" type="button" aria-label="Dialog schließen">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 6L6 18M6 6L18 18" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
          </svg>
        </button>
      </header>

      <div class="modal-card">
        <label class="field">
          <span class="label">Typ</span>
          <span class="input">
            <span>Blutzucker</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true" style="margin-left:auto">
              <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-linecap="round" stroke-width="2" />
            </svg>
          </span>
        </label>

        <div class="form-row">
          <label class="field">
            <span class="label">Startdatum</span>
            <span class="input"><input value="Heute" aria-label="Startdatum" /></span>
          </label>
          <label class="field">
            <span class="label">Enddatum</span>
            <span class="input"><input placeholder="Kein Enddatum (fortlaufend)" aria-label="Enddatum" /></span>
          </label>
        </div>

        <div class="frequency-block">
          <span class="label">Häufigkeit</span>
          <span class="frequency-builder" data-frequency-control>
            <span class="frequency-prefix" data-frequency-prefix>Alle</span>
            <span class="stepper">
              <button class="step-button" type="button" aria-label="Intervall verringern" data-frequency-step="-1">−</button>
              <input type="number" value="3" min="1" inputmode="numeric" aria-label="Intervall-Anzahl" data-frequency-amount />
              <button class="step-button" type="button" aria-label="Intervall erhöhen" data-frequency-step="1">+</button>
            </span>
            <select aria-label="Intervall-Einheit" data-frequency-unit>
              <option value="minutes" data-singular="Minute" data-plural="Minuten" data-every="Jede">Minuten</option>
              <option value="hours" data-singular="Stunde" data-plural="Stunden" data-every="Jede">Stunden</option>
              <option value="days" data-singular="Tag" data-plural="Tage" data-every="Jeden" selected>Tage</option>
              <option value="weeks" data-singular="Woche" data-plural="Wochen" data-every="Jede">Wochen</option>
              <option value="months" data-singular="Monat" data-plural="Monate" data-every="Jeden">Monate</option>
            </select>
            <span class="frequency-join">um</span>
            <span class="input time-input">
              <input value="00:00" aria-label="Startzeit" data-start-time />
            </span>
          </span>

          <div class="weekday-section" data-frequency-weekdays aria-hidden="true">
            <span class="label">Tage auswählen</span>
            <span class="weekdays">
              <button class="chip" type="button" aria-pressed="false">Mo</button>
              <button class="chip is-active" type="button" aria-pressed="true">Di</button>
              <button class="chip" type="button" aria-pressed="false">Mi</button>
              <button class="chip" type="button" aria-pressed="false">Do</button>
              <button class="chip is-active" type="button" aria-pressed="true">Fr</button>
              <button class="chip" type="button" aria-pressed="false">Sa</button>
              <button class="chip" type="button" aria-pressed="false">So</button>
            </span>
          </div>
        </div>

        <section class="preview" aria-live="polite">
          <strong>Vorschau</strong>
          <span data-frequency-preview>Alle 3 Tage um 00:00 Uhr.</span>
        </section>
      </div>

      <footer class="modal-footer">
        <button class="btn" type="button">Abbrechen</button>
        <button class="btn btn-primary" type="button">Planung anlegen</button>
      </footer>
    </div>
  </section>

  <script>
    const frequencyControl = document.querySelector("[data-frequency-control]");

    const updateFrequencyCopy = () => {
      if (!frequencyControl) return;
      const input = frequencyControl.querySelector("[data-frequency-amount]");
      const unitSelect = frequencyControl.querySelector("[data-frequency-unit]");
      const prefix = frequencyControl.querySelector("[data-frequency-prefix]");
      const weekdays = document.querySelector("[data-frequency-weekdays]");
      const startTime = document.querySelector("[data-start-time]");
      const preview = document.querySelector("[data-frequency-preview]");
      const amount = Math.max(Number(input.min || 1), Number(input.value || input.min || 1));
      const selectedOption = unitSelect.selectedOptions[0];
      const isSingular = amount === 1;

      unitSelect.querySelectorAll("option").forEach((option) => {
        option.textContent = isSingular ? option.dataset.singular : option.dataset.plural;
      });

      prefix.textContent = isSingular ? selectedOption.dataset.every : "Alle";

      const showWeekdays = unitSelect.value === "weeks";
      weekdays.classList.toggle("is-visible", showWeekdays);
      weekdays.setAttribute("aria-hidden", String(!showWeekdays));

      const selectedWeekdays = Array.from(document.querySelectorAll("[data-frequency-weekdays] .chip.is-active"))
        .map((chip) => chip.textContent.trim());
      const cadence = isSingular
        ? `${selectedOption.dataset.every} ${selectedOption.dataset.singular}`
          .replace("Jeden Tag", "Täglich")
          .replace("Jede Woche", "Wöchentlich")
          .replace("Jeden Monat", "Monatlich")
        : `Alle ${amount} ${selectedOption.dataset.plural}`;
      const weekdayText = showWeekdays && selectedWeekdays.length ? ` (${selectedWeekdays.join(", ")})` : "";
      preview.textContent = `${cadence}${weekdayText} um ${startTime.value || "00:00"} Uhr.`;
    };

    frequencyControl.querySelectorAll("[data-frequency-step]").forEach((button) => {
      button.addEventListener("click", () => {
        const input = frequencyControl.querySelector("[data-frequency-amount]");
        const step = Number(button.dataset.frequencyStep);
        const nextValue = Math.max(Number(input.min || 1), Number(input.value || input.min || 1) + step);
        input.value = String(nextValue);
        updateFrequencyCopy();
      });
    });

    frequencyControl.querySelector("[data-frequency-amount]").addEventListener("input", updateFrequencyCopy);
    frequencyControl.querySelector("[data-frequency-unit]").addEventListener("change", updateFrequencyCopy);
    document.querySelector("[data-start-time]").addEventListener("input", updateFrequencyCopy);

    frequencyControl.querySelector("[data-frequency-amount]").addEventListener("blur", (event) => {
      event.currentTarget.value = String(Math.max(Number(event.currentTarget.min || 1), Number(event.currentTarget.value || 1)));
      updateFrequencyCopy();
    });

    document.querySelectorAll("[data-frequency-weekdays] .chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const nextPressed = chip.getAttribute("aria-pressed") !== "true";
        chip.setAttribute("aria-pressed", String(nextPressed));
        chip.classList.toggle("is-active", nextPressed);
        updateFrequencyCopy();
      });
    });

    updateFrequencyCopy();
  </script>
</body>
</html>
