<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Layout-Varianten</title>
  <link rel="stylesheet" href="tokens.css?v=4" />
  <link rel="stylesheet" href="style.css?v=17" />
  <link rel="stylesheet" href="intensiv.css?v=2" />
  <link rel="stylesheet" href="layout-varianten.css?v=1" />
</head>
<body>
  <div class="main-view intensiv-app layout-variants-app">
    <div class="bg-decoration" aria-hidden="true"></div>

    <header class="title-bar">
      <div class="title-bar__title">Layout-Varianten</div>
      <div class="title-bar__controls">
        <button class="caption-btn" type="button" aria-label="Minimieren">
          <svg viewBox="0 0 10 1" width="10" height="1"><rect width="10" height="1" fill="currentColor" /></svg>
        </button>
        <button class="caption-btn" type="button" aria-label="Maximieren">
          <svg viewBox="0 0 10 10" width="10" height="10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" /></svg>
        </button>
        <button class="caption-btn caption-btn--close" type="button" aria-label="Schließen">
          <svg viewBox="0 0 10 10" width="10" height="10"><path d="M0 0 L10 10 M10 0 L0 10" stroke="currentColor" /></svg>
        </button>
      </div>
    </header>

    <div class="app-body">
      <aside class="sidebar sidebar--expanded" aria-label="Seitennavigation">
        <div class="sidebar__top">
          <a class="sidebar-brand" href="intensiv.html" aria-label="Start">
            <img src="assets/logo-cura.svg" alt="" />
            <span class="sidebar-icon__label">CuraSoft</span>
          </a>

          <div class="sidebar-divider"></div>

          <button class="sidebar-icon sidebar-icon--selected" type="button" aria-label="Layout-Varianten">
            <svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 5C4 3.9 4.9 3 6 3H18C19.1 3 20 3.9 20 5V19C20 20.1 19.1 21 18 21H6C4.9 21 4 20.1 4 19V5Z" stroke="currentColor" stroke-width="2" />
              <path d="M9 3V21M4 9H20M4 15H20" stroke="currentColor" stroke-width="2" />
            </svg>
            <span class="sidebar-icon__label">Layouts</span>
          </button>
        </div>
      </aside>

      <main class="content-shell layout-variants-shell" aria-label="Layout-Varianten">
        <section class="panel panel--main layout-variants-panel">
          <header class="layout-variants-header">
            <div>
              <span class="contract-eyebrow">Neutral gesammelt</span>
              <h1>Layout-Varianten</h1>
            </div>
          </header>

          <div class="layout-variant-grid">
            <article class="layout-variant-card" data-layout="split">
              <header>
                <span>01</span>
                <h2>Split View</h2>
              </header>
              <div class="layout-preview layout-preview--split" aria-hidden="true">
                <div class="preview-pane preview-pane--left">
                  <span></span><span></span><span></span><span></span>
                </div>
                <div class="preview-resizer"></div>
                <div class="preview-pane preview-pane--right">
                  <span></span><span></span><span></span>
                </div>
              </div>
            </article>

            <article class="layout-variant-card" data-layout="table-block">
              <header>
                <span>02</span>
                <h2>Tabellenblock</h2>
              </header>
              <div class="layout-preview layout-preview--table" aria-hidden="true">
                <div class="preview-table-card"></div>
                <div class="preview-table-card"></div>
                <div class="preview-table-card"></div>
                <div class="preview-table-card"></div>
              </div>
            </article>

            <article class="layout-variant-card" data-layout="split-seamless">
              <header>
                <span>03</span>
                <h2>Seamless Split</h2>
              </header>
              <div class="layout-preview layout-preview--seamless" aria-hidden="true">
                <div class="preview-topbar"></div>
                <div class="preview-seamless-body">
                  <div></div>
                  <span></span>
                  <div></div>
                </div>
              </div>
            </article>

            <article class="layout-variant-card" data-layout="column-grid">
              <header>
                <span>04</span>
                <h2>Spalten-Grid</h2>
              </header>
              <div class="layout-preview layout-preview--grid" aria-hidden="true">
                <div></div><div></div><div></div><div></div>
                <div></div><div></div><div></div><div></div>
                <div></div><div></div><div></div><div></div>
                <div></div><div></div><div></div><div></div>
              </div>
            </article>

            <article class="layout-variant-card" data-layout="detail-topbar">
              <header>
                <span>05</span>
                <h2>Breadcrumbs & Actions</h2>
              </header>
              <div class="layout-preview layout-preview--detail" aria-hidden="true">
                <div class="preview-topbar preview-topbar--actions">
                  <span></span><span></span>
                </div>
                <div class="preview-detail-body">
                  <div></div>
                  <span></span>
                  <div></div>
                </div>
              </div>
            </article>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="layout-varianten.js?v=1"></script>
</body>
</html>
